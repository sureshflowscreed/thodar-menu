<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thodar Food Corner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        .loading-container {
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        .logo {
            width: 100%;
            max-width: 420px;
            height: auto;
            display: block;
            margin: 0 auto 30px;
        }

        .spinner {
            width: 42px;
            height: 42px;
            margin: 0 auto 20px;
            border: 4px solid #e5e7eb;
            border-top-color: #0b4d9b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status {
            color: #0b4d9b;
            font-size: 17px;
            font-weight: bold;
        }

        .small {
            margin-top: 10px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="loading-container">

    <img
        src="https://sureshflowscreed.github.io/thodar-menu/static/thodar_loading.png"
        class="logo"
        alt="Thodar Food Corner">

    <div class="spinner"></div>

    <div class="status">
        Preparing your menu...
    </div>

    <div class="small">
        Please wait a moment
    </div>

</div>

<script>

const MENU_URL =
    "https://thodar-cafe.onrender.com/menu";

function wakeServer() {

    /*
       no-cors allows this page to send a request
       to Render even though it is another domain.
    */

    fetch(MENU_URL, {
        mode: "no-cors",
        cache: "no-store"
    }).catch(() => {});

}

/* Wake Render immediately */
wakeServer();

/* Keep sending a wake request every 5 seconds */
setInterval(wakeServer, 5000);

/*
   Give Render some time to start,
   then open the customer menu.
*/
setTimeout(() => {

    window.location.replace(
        MENU_URL + "?t=" + Date.now()
    );

}, 15000);

</script>

</body>
</html>
